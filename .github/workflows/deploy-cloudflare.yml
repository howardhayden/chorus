name: Deploy CHORUS to Cloudflare

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: chorus-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-and-deploy:
    name: Verify and deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - name: Check out the release source
        uses: actions/checkout@v6

      - name: Use the validated Node.js runtime
        uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install the locked dependency graph
        run: npm ci

      - name: Verify the release
        run: npm run verify:release

      - name: Deploy the verified build
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.124.0
          command: deploy --config dist/server/wrangler.json

      - name: Verify the canonical public routes
        shell: bash
        run: |
          set -euo pipefail
          for url in \
            https://chorus.observer/ \
            https://chorus.observer/notebooks/index.html \
            https://chorus.observer/evidence/index.html
          do
            curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --retry 12 \
              --retry-all-errors \
              --retry-delay 10 \
              --max-time 30 \
              --output /dev/null \
              "$url"
          done
