name: Export complete CHORUS source

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/export-complete-chorus-20260819'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out exact source
        uses: actions/checkout@v6

      - name: Use compatible Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.16.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Package source and dependencies
        shell: bash
        run: |
          set -euo pipefail
          tar \
            --exclude=.git \
            --exclude=.github/workflows/export-complete-chorus.yml \
            -czf /tmp/chorus-base-with-deps.tar.gz \
            .

      - name: Upload exact export
        uses: actions/upload-artifact@v4
        with:
          name: chorus-base-with-deps
          path: /tmp/chorus-base-with-deps.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
