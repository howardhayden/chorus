name: Capture CHORUS lockfile audit

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/export-complete-chorus-20260819'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out exact source
        uses: actions/checkout@v6

      - name: Use compatible Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.16.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Capture registry advisory evidence
        run: python3 scripts/docs/capture_dependency_audit.py

      - name: Upload audit result
        uses: actions/upload-artifact@v4
        with:
          name: chorus-lockfile-audit
          path: evidence/runs/dependency-audit.v1.json
          if-no-files-found: error
          retention-days: 1
