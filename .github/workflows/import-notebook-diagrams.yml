name: Import disciplined CHORUS notebook diagrams

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chorus-notebook-diagram-import
  cancel-in-progress: false

jobs:
  import-verify-and-publish:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/notebook-diagrams-20260819'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out the exact diagram branch
        uses: actions/checkout@v6
        with:
          ref: agent/notebook-diagrams-20260819
          fetch-depth: 0

      - name: Reconstruct and apply the source update
        shell: bash
        run: |
          set -euo pipefail
          cat .import/notebook-diagrams.part-* | base64 --decode > /tmp/notebook-diagrams.patch.xz
          echo "7e548ad99b299b42470e318eb3e17ea9c5fcf3383c463f80944acf79cacd3c00  /tmp/notebook-diagrams.patch.xz" | sha256sum --check -
          xz --decompress --stdout /tmp/notebook-diagrams.patch.xz > /tmp/notebook-diagrams.patch
          echo "594757d02cc54f687d15b7490e95d9181faf9d9ce94ea4136b430070701c0aa9  /tmp/notebook-diagrams.patch" | sha256sum --check -
          git apply --index /tmp/notebook-diagrams.patch

      - name: Use the validated Node.js runtime
        uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install the locked dependency graph
        run: npm ci

      - name: Generate all executed scholarly publications
        run: |
          npm run docs:build:working-tree
          npm run status:build

      - name: Verify the complete current source tree
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          rm -rf dist .next
          npm run verify:working-tree 2>&1 | tee evidence/runs/updated-working-tree-verification.v1.log

      - name: Exercise every published route
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- --hostname 127.0.0.1 --port 4181 > /tmp/chorus-production.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error --output /dev/null http://127.0.0.1:4181/; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/chorus-production.log >&2
              exit 1
            fi
            sleep 1
          done

          python3 - <<'PY'
          from __future__ import annotations

          from datetime import datetime, timezone
          from hashlib import sha256
          from pathlib import Path
          from urllib.request import Request, urlopen
          import json

          root = Path('.')
          base = 'http://127.0.0.1:4181'
          updated_routes = [
              '/',
              '/notebooks/index.html',
              '/notebooks/chorus-systems-atlas.html',
              '/notebooks/chorus-model-specification.html',
              '/notebooks/chorus-research-design.html',
              '/notebooks/chorus-validation-atlas.html',
              '/evidence/index.html',
              '/evidence/updated-working-tree-status.html',
              '/evidence/updated-working-tree-status.v1.json',
              '/favicon.svg',
              '/favicon.ico',
              '/favicon-16x16.png',
              '/favicon-32x32.png',
              '/apple-touch-icon.png',
              '/icon-192.png',
              '/icon-512.png',
              '/site.webmanifest',
          ]
          final_routes = [
              '/',
              '/notebooks/index.html',
              '/notebooks/chorus-systems-atlas.html',
              '/notebooks/chorus-model-specification.html',
              '/notebooks/chorus-research-design.html',
              '/notebooks/chorus-validation-atlas.html',
              '/notebooks/CHORUS-Model-Specification.ipynb',
              '/notebooks/CHORUS-Research-Design.ipynb',
              '/evidence/index.html',
              '/evidence/updated-working-tree-status.html',
              '/evidence/updated-working-tree-status.v1.json',
              '/evidence/updated-route-check.v1.json',
              '/evidence/dependency-audit.updated-working-tree.v1.json',
              '/favicon.svg',
              '/favicon.ico',
              '/favicon-16x16.png',
              '/favicon-32x32.png',
              '/apple-touch-icon.png',
              '/icon-192.png',
              '/icon-512.png',
              '/site.webmanifest',
          ]

          def fetch(route: str) -> dict[str, object]:
              request = Request(base + route, headers={'User-Agent': 'CHORUS route verification'})
              with urlopen(request, timeout=30) as response:
                  payload = response.read()
                  status = response.status
                  content_type = (response.headers.get_content_type() or 'application/octet-stream')
              if status != 200:
                  raise RuntimeError(f'{route}: HTTP {status}')
              return {
                  'route': route,
                  'status': status,
                  'content_type': content_type,
                  'bytes': len(payload),
                  'sha256': sha256(payload).hexdigest(),
              }

          captured_at = datetime.now(timezone.utc).isoformat(timespec='seconds')
          environment = {
              'server': 'vinext production server',
              'host': '127.0.0.1',
              'port': 4181,
              'network': 'loopback only',
          }

          updated_rows = [fetch(route) for route in updated_routes]
          updated = {
              'format': 'CHORUS_UPDATED_ROUTE_CHECK',
              'schema_version': 1,
              'status': 'pass',
              'captured_at': captured_at,
              'environment': environment,
              'routes': updated_rows,
              'summary': {'checked': len(updated_rows), 'passed': len(updated_rows), 'failed': 0},
          }
          updated_bytes = (json.dumps(updated, indent=2) + '\n').encode()
          for path in (
              root / 'evidence/runs/updated-route-check.v1.json',
              root / 'public/evidence/updated-route-check.v1.json',
              root / 'dist/client/evidence/updated-route-check.v1.json',
          ):
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(updated_bytes)

          final_rows = [fetch(route) for route in final_routes]
          final = {
              'format': 'CHORUS_FINAL_ROUTE_CHECK',
              'schema_version': 1,
              'status': 'pass',
              'captured_at': captured_at,
              'environment': environment,
              'checked': len(final_rows),
              'routes': final_rows,
              'summary': {'checked': len(final_rows), 'passed': len(final_rows), 'failed': 0},
          }
          final_bytes = (json.dumps(final, indent=2) + '\n').encode()
          for path in (
              root / 'evidence/runs/final-output-route-check.v1.json',
              root / 'public/evidence/final-output-route-check.v1.json',
              root / 'dist/client/evidence/final-output-route-check.v1.json',
          ):
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(final_bytes)

          print(f'Route verification passed: {len(final_rows)}/{len(final_rows)} HTTP 200 responses.')
          PY

          kill "$server_pid"
          wait "$server_pid" || true
          trap - EXIT

      - name: Remove transfer and build-local scaffolding
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .import .next .wrangler scripts/docs/__pycache__ tests/__pycache__
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          rm -f .DS_Store .github/workflows/import-notebook-diagrams.yml

      - name: Refresh complete-tree manifest and checksums
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          root = Path('.')
          excluded_roots = {'.git', 'node_modules', '.next', '.wrangler'}
          excluded_names = {'.DS_Store', 'OUTPUT-MANIFEST.json', 'CHECKSUMS.sha256'}
          rows = []
          for path in sorted(root.rglob('*')):
              if not path.is_file():
                  continue
              relative = path.relative_to(root)
              if relative.parts[0] in excluded_roots:
                  continue
              if path.name in excluded_names or '__pycache__' in relative.parts or path.suffix == '.pyc':
                  continue
              payload = path.read_bytes()
              rows.append({
                  'path': relative.as_posix(),
                  'bytes': len(payload),
                  'sha256': hashlib.sha256(payload).hexdigest(),
              })

          manifest = {
              'format': 'CHORUS_COMPLETE_OUTPUT_MANIFEST',
              'schema_version': 1,
              'algorithm': 'sha256',
              'file_count': len(rows),
              'total_payload_bytes': sum(row['bytes'] for row in rows),
              'artifacts': rows,
          }
          Path('OUTPUT-MANIFEST.json').write_text(json.dumps(manifest, indent=2) + '\n')
          Path('CHECKSUMS.sha256').write_text(
              ''.join(f"{row['sha256']}  {row['path']}\n" for row in rows)
          )
          PY

      - name: Commit the verified diagram publications
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --name-only | grep -E '^(\.import/|\.github/workflows/import-notebook-diagrams\.yml$)'; then
            echo "Transfer scaffolding remains in the proposed tree." >&2
            exit 1
          fi
          git commit -m "Add disciplined diagrams to CHORUS notebooks"
          git fetch origin main
          git push origin HEAD:agent/notebook-diagrams-20260819
