name: Apply license policy

on:
  push:
    branches:
      - chore/license-policy-2026-08-24
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.TARGET_BRANCH }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Apply scoped licenses and verify
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p LICENSES
          curl --fail --silent --show-error --location --retry 3 \
            https://raw.githubusercontent.com/spdx/license-list-data/main/text/AGPL-3.0-or-later.txt \
            --output LICENSE
          curl --fail --silent --show-error --location --retry 3 \
            https://raw.githubusercontent.com/spdx/license-list-data/main/text/CC-BY-NC-SA-4.0.txt \
            --output LICENSES/CC-BY-NC-SA-4.0.txt
          curl --fail --silent --show-error --location --retry 3 \
            https://raw.githubusercontent.com/spdx/license-list-data/main/text/CC0-1.0.txt \
            --output LICENSES/CC0-1.0.txt

          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          licensing = '''# Repository licensing

CHORUS combines browser-delivered simulation software, authored scenario and interface content embedded in source, standalone scholarly and educational publications, machine-readable artifact manifests, original source identity, and third-party components. These categories use separate licenses.

## Software and embedded simulation content — AGPL-3.0-or-later

Unless a file carries a more specific notice, application and Worker source, simulation logic, tests, scripts, package manifests, build configuration, and authored text or data embedded in source files are licensed under the [GNU Affero General Public License, version 3 or later](LICENSE).

This license preserves the freedom to inspect, modify, and redistribute the program. A modified version made available to users over a network must offer those users its corresponding source under the AGPL. Source for the official deployment is maintained in this repository.

## Standalone scholarly, educational, and creative material — CC BY-NC-SA 4.0

Unless a file carries a more specific notice, original standalone documentation, executed notebooks, rendered notebook publications, diagrams, explanatory evidence narratives, and other non-software creative material are licensed under the [Creative Commons Attribution-NonCommercial-ShareAlike 4.0 International License](LICENSES/CC-BY-NC-SA-4.0.txt).

This Creative Commons license does not apply to software. Commercial reuse of this separately licensed material requires separate permission.

## Machine-readable artifact manifests — CC0-1.0

`CHECKSUMS.sha256`, `OUTPUT-MANIFEST.json`, `notebooks/artifact-manifest.json`, and `public/notebooks/artifact-manifest.json` are dedicated under [CC0 1.0 Universal](LICENSES/CC0-1.0.txt) to support unrestricted verification, mirroring, and interoperability. This dedication does not change the licenses of the works described by those manifests.

## Marks and source identity — reserved

The name **CHORUS**, project domains, logos, trade dress, and other source-identifying marks are not licensed as trademarks or service marks. Accurate descriptive and nominative use permitted by law remains unaffected.

## Third-party material

Third-party software, fonts, quotations, images, reference material, and other incorporated works retain their own notices and terms. Their specific notices override this repository-level map. No license is granted to material for which the licensor lacks authority.

## File-level priority

The most specific notice controls. A notice in a file or its containing directory overrides this map. A source file combining executable code with embedded narrative or educational content is treated as AGPL-covered software. Generated output follows the license of its source unless the output carries a different notice.

## Contributions

By submitting a contribution, a contributor represents that they have the right to submit it and agrees to license it under the terms governing the affected material in this file. Third-party material must retain its original notices and terms.

## Effective revision and earlier copies

This policy applies to revisions committed on or after **August 24, 2026**. It does not revoke rights already received in an earlier copy under the license that accompanied that copy. Earlier licensed revisions remain available under their prior terms.
'''
          (root / 'LICENSING.md').write_text(licensing, encoding='utf-8')

          readme_path = root / 'README.md'
          readme = readme_path.read_text(encoding='utf-8').rstrip()
          section = '''## License

CHORUS uses scoped licensing: software and embedded simulation content are [AGPL-3.0-or-later](LICENSE), separately published scholarly, educational, and creative materials are [CC BY-NC-SA 4.0](LICENSES/CC-BY-NC-SA-4.0.txt), and specified machine-readable artifact manifests are [CC0-1.0](LICENSES/CC0-1.0.txt). Project marks are reserved, and third-party materials retain their own terms. See [LICENSING.md](LICENSING.md) for the controlling file-level rules.'''
          pattern = re.compile(r'(?ms)^## License\n.*?(?=^## |\Z)')
          if pattern.search(readme):
              readme = pattern.sub(section + '\n\n', readme).rstrip()
          else:
              readme += '\n\n' + section
          readme_path.write_text(readme + '\n', encoding='utf-8')

          validation_path = root / 'OUTPUT-VALIDATION.md'
          validation = validation_path.read_text(encoding='utf-8')
          marker = '- locked dependency declarations;\n'
          addition = '- scoped software, publication, manifest, and source-identity licensing terms;\n'
          if addition not in validation:
              if marker not in validation:
                  raise SystemExit('Could not locate OUTPUT-VALIDATION package-content marker')
              validation = validation.replace(marker, marker + addition, 1)
              validation_path.write_text(validation, encoding='utf-8')
          PY

          npm ci
          npm run verify:working-tree

          rm .github/workflows/license-policy-migration.yml

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          root = Path('.')
          manifest_path = root / 'OUTPUT-MANIFEST.json'
          prior = json.loads(manifest_path.read_text(encoding='utf-8'))
          paths = {item['path'] for item in prior['artifacts']}
          paths.update({
              'LICENSE',
              'LICENSING.md',
              'LICENSES/CC-BY-NC-SA-4.0.txt',
              'LICENSES/CC0-1.0.txt',
          })
          artifacts = []
          for relative in sorted(paths):
              path = root / relative
              if not path.is_file():
                  raise SystemExit(f'Manifested path is missing: {relative}')
              payload = path.read_bytes()
              artifacts.append({
                  'path': relative,
                  'bytes': len(payload),
                  'sha256': hashlib.sha256(payload).hexdigest(),
              })
          manifest = {
              'format': prior['format'],
              'schema_version': prior['schema_version'],
              'algorithm': prior['algorithm'],
              'file_count': len(artifacts),
              'total_payload_bytes': sum(item['bytes'] for item in artifacts),
              'artifacts': artifacts,
          }
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          checksums = ''.join(f"{item['sha256']}  {item['path']}\n" for item in artifacts)
          (root / 'CHECKSUMS.sha256').write_text(checksums, encoding='utf-8')
          PY

          sha256sum --check CHECKSUMS.sha256
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          root = Path('.')
          manifest = json.loads((root / 'OUTPUT-MANIFEST.json').read_text(encoding='utf-8'))
          assert manifest['file_count'] == len(manifest['artifacts'])
          assert manifest['total_payload_bytes'] == sum(item['bytes'] for item in manifest['artifacts'])
          for item in manifest['artifacts']:
              payload = (root / item['path']).read_bytes()
              assert len(payload) == item['bytes']
              assert hashlib.sha256(payload).hexdigest() == item['sha256']
          print(f"Verified {manifest['file_count']} manifested artifacts.")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Apply scoped CHORUS licensing"
          git push origin HEAD:"${TARGET_BRANCH}"
